<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão Técnica da Sonda</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 48 48" width="38" height="38" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
          <path d="M23 3.5h2" stroke-width="2.4"/>
          <path d="M22.4 4.5 18.5 23.5M25.6 4.5 29.5 23.5"/>
          <path d="M21.6 8.5h4.8M20.8 12.5h6.4M20 16.5h8M19.2 20.5h9.6"/>
          <path d="M21.6 8.5l5.6 4M26.4 8.5l-5.6 4M20.8 12.5l7.2 4M27.2 12.5l-7.2 4M20 16.5l8.8 4M28 16.5l-8.8 4" stroke-width="1"/>
          <path d="M33 23.5V15l7 3" stroke-width="1.3"/>
          <rect x="7" y="19.5" width="7" height="4" rx=".5"/>
          <rect x="4.5" y="23.5" width="39" height="4.5" rx="1" fill="currentColor" fill-opacity=".18"/>
          <path d="M9 28v10.5M14 28v10.5M34 28v10.5M39 28v10.5"/>
          <rect x="5" y="38.5" width="38" height="5" rx="2.5" fill="currentColor" fill-opacity=".18"/>
          <path d="M2 36.5c2.5 0 2.5-1.5 5-1.5s2.5 1.5 5 1.5 2.5-1.5 5-1.5 2.5 1.5 5 1.5 2.5-1.5 5-1.5 2.5 1.5 5 1.5 2.5-1.5 5-1.5 2.5 1.5 5 1.5 2.5-1.5 4-1.5" stroke="#4c9be8" stroke-width="1.4"/>
        </svg></div>
        <div>
          <div class="brand-title">Gestão Técnica</div>
          <div class="brand-sub" id="brandSonda">Sonda</div>
        </div>
      </div>
      <nav class="nav">
        <a href="#dashboard" data-route="dashboard"><span>📊</span> Painel</a>
        <a href="#nrs" data-route="nrs"><span>📘</span> Normas Regulamentadoras</a>
        <a href="#sgso" data-route="sgso"><span>🛡️</span> SGSO – ANP</a>
        <a href="#criticos" data-route="criticos"><span>⚠️</span> Itens Críticos ANP</a>
        <a href="#auditorias" data-route="auditorias"><span>🔎</span> Auditorias</a>
        <a href="#acoes" data-route="acoes"><span>✅</span> Plano de Ação</a>
        <a href="#config" data-route="config"><span>⚙️</span> Configurações</a>
      </nav>
      <div class="sidebar-foot" id="lastSave">—</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="btn icon only-mobile" id="menuBtn" aria-label="Menu">☰</button>
        <h1 id="pageTitle">Painel</h1>
        <div class="topbar-actions">
          <button class="btn" id="exportBtn" title="Exportar banco JSON">⬇ Exportar JSON</button>
          <button class="btn" id="printBtn" onclick="window.print()" title="Imprimir página">🖨 Imprimir</button>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <dialog id="modal">
    <form method="dialog" class="modal-card" id="modalForm" onsubmit="return false">
      <div class="modal-head">
        <h2 id="modalTitle">Detalhe</h2>
        <button type="button" class="btn icon" id="modalClose" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </form>
  </dialog>

  <dialog id="confirmDlg">
    <div class="modal-card confirm-card">
      <div class="modal-body"><p id="confirmMsg" style="margin:0;font-weight:600"></p></div>
      <div class="modal-foot">
        <button type="button" class="btn" id="confirmCancel">Cancelar</button>
        <button type="button" class="btn danger" id="confirmOk">Confirmar</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <!-- Fallback para abrir via file:// (sem servidor). Em servidor, data/database.json é carregado via fetch. -->
  <!-- SheetJS: geração do arquivo Excel do Plano de Ação -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- jsPDF + AutoTable: relatório de auditoria em PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="data/database.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
